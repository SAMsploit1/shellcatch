# /etc/wazuh-selfmon.conf. Every key is optional; defaults are shown.
# See README.md for what each check does.

#EXPECTED_DAEMONS=wazuh-analysisd wazuh-remoted wazuh-db wazuh-modulesd wazuh-logcollector wazuh-execd wazuh-syscheckd wazuh-monitord wazuh-authd wazuh-apid
# In a cluster, add wazuh-clusterd. On a worker node, remove wazuh-authd and wazuh-apid if you don't run them.

# wazuh-db resident memory (MB). Size these to your RAM; 0 disables a tier.
#WDB_RSS_WARN_MB=4096
#WDB_RSS_HIGH_MB=8192
#WDB_RSS_CRIT_MB=12288

# Share of events analysisd dropped between two runs (%).
#DROP_WARN_PCT=1
#DROP_HIGH_PCT=10
#DROP_CRIT_PCT=50

# Indexer. Defaults use the all-in-one admin client certificate.
#INDEXER_URL=https://127.0.0.1:9200
#INDEXER_USER=
#INDEXER_PASS=
# Disk watermarks are read from the cluster settings, so custom ones are honoured.

# Out-of-band alerting. If the manager is down, a Wazuh alert goes nowhere.
#NOTIFY_URL=https://ntfy.sh/<your-private-topic>
#NOTIFY_FORMAT=text
#NOTIFY_MIN=critical

# Dead man's switch for a dead host (e.g. healthchecks.io or Uptime Kuma push URL).
#HEARTBEAT_URL=

# Start missing daemons / a stopped manager. Rate-limited.
#REMEDIATE=no
#REMEDIATE_MAX_PER_HOUR=3

#DISABLE=
