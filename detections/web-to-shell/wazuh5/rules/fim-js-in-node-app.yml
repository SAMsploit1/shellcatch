# Migrated from 4.x rule 100572 (level 10 -> high).
# 4.x relied on the agent's <ignore> for node_modules; the rule repeats it so
# the finding stays quiet even if the agent config drifts.
enabled: true
status: experimental
level: high
metadata:
  title: "Web-to-shell: new JavaScript file in Node.js app directory: {{file.path}}"
  author: SAMspl0it
  description: A JavaScript file was created in the Node.js application directory.
  references:
    - https://github.com/SAMsploit1/shellcatch
logsource:
  product: web-to-shell
  category: file_event
  service: fim
detection:
  condition: fim and app_dir and js and not deps
  fim:
    wazuh.integration.name: wazuh-fim
    event.action: created
  app_dir:
    file.path|startswith: /opt/nodeapp/
  js:
    file.extension: [js, mjs, cjs]
  deps:
    file.path|contains: /node_modules/
mitre:
  tactic:
    id: [TA0003]
    name: [Persistence]
  technique:
    id: [T1505]
    name: [Server Software Component]
  subtechnique:
    id: [T1505.003]
    name: [Web Shell]
tags: [attack.persistence, attack.t1505.003, shellcatch.drop]
falsepositives:
  - Deployments. Adjust /opt/nodeapp/ to your app directory.
