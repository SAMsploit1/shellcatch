# Migrated from 4.x rule 100562 (level 6 -> low).
enabled: true
status: experimental
level: low
metadata:
  title: "Web-to-shell: request with command-style parameter from {{source.ip}}"
  author: SAMspl0it
  description: The query string has a cmd=, exec=, command=, execute=, shell= or run= parameter.
  references:
    - https://github.com/SAMsploit1/shellcatch
logsource:
  product: web-to-shell
  category: webserver
  service: access
detection:
  condition: access and 1 of param_*
  access:
    event.action: http-request
  # Lucene regex treats "&" as an operator, so this one is written without
  # |re: the parameter starts the query string or follows an "&".
  param_first:
    url.query|startswith: ["cmd=", "CMD=", "Cmd=", "exec=", "EXEC=", "Exec=", "command=", "COMMAND=", "Command=", "execute=", "EXECUTE=", "Execute=", "shell=", "SHELL=", "Shell=", "run=", "RUN=", "Run="]
  param_next:
    url.query|contains: ["&cmd=", "&CMD=", "&Cmd=", "&exec=", "&EXEC=", "&Exec=", "&command=", "&COMMAND=", "&Command=", "&execute=", "&EXECUTE=", "&Execute=", "&shell=", "&SHELL=", "&Shell=", "&run=", "&RUN=", "&Run="]
mitre:
  tactic:
    id: [TA0003]
    name: [Persistence]
  technique:
    id: [T1505]
    name: [Server Software Component]
  subtechnique:
    id: [T1505.003]
    name: [Web Shell]
tags: [attack.persistence, attack.t1505.003, shellcatch.request]
falsepositives:
  - Apps with a legitimate parameter named run or command.
